# Blackbox exporter on the NUC k3s (ns observability). It probes public URLs from OUTSIDE Spark,
# so a Spark, tunnel or DNS failure is caught. Plain manifests: helm couldn't fetch the chart
# (github release assets were TLS-intercepted on the dev machine, 2026-10-13).
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter
  namespace: observability
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          valid_status_codes: [200]
          preferred_ip_protocol: ip4
          follow_redirects: false   # a redirect means the zone page rule caught us; that's an outage for the demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: observability
  labels: {app: blackbox-exporter}
spec:
  replicas: 1
  selector:
    matchLabels: {app: blackbox-exporter}
  template:
    metadata:
      labels: {app: blackbox-exporter}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.27.0
          args: ["--config.file=/config/blackbox.yml"]
          ports: [{containerPort: 9115, name: http}]
          readinessProbe:
            httpGet: {path: /-/healthy, port: 9115}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: config, mountPath: /config}]
      volumes:
        - name: config
          configMap: {name: blackbox-exporter}
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  selector: {app: blackbox-exporter}
  ports: [{port: 9115, targetPort: 9115, name: http}]
